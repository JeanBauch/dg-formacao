name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the code; a compromised step cannot push, comment or change settings with this token.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The database tests and the E2E each create a database of their own here,
    # set up from scratch on every run by the roles script and the migrations;
    # the E2E also seeds its one. Same image and fictitious credentials as
    # compose.yaml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dg_formacao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The build loads each route's module, which validates the configuration:
      # fictitious values, of which the server reads its own again when it starts.
      - run: pnpm build
        env:
          APP_ENV: ci
          SIGNUP_ENABLED: "true"
          DATABASE_URL: postgresql://dg_app:dg_app@localhost:5432/dg_formacao_e2e
          MAILER_ADAPTER: file
      - run: pnpm exec playwright install --with-deps chromium
      # Against that build's production server. Before the first test, the E2E's
      # database gets part 1 of the roles script, the migrations from scratch,
      # part 2 and the seed's holder (e2e/database.setup.ts).
      - run: pnpm test:e2e
